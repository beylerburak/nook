server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://nook-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://nook-api:3000;
  }

  # Hashed filenames (assets-XXXXXXXX.js) never change content under a given
  # name, so browsers and the service worker can cache them forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The two HTML shells (landing "/" and the app at "/app"), the service
  # worker and the manifest are what decide what a returning client (or the
  # SW's own install step) sees next — never let an intermediate cache serve
  # a stale copy of any of them.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /app/index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  # "/app" (no trailing slash) and everything under "/app/" is the
  # client-routed app shell (apps/web/src/router.ts) — always fall back to
  # its one HTML file, never to the landing page's. try_files' internal
  # redirect to /app/index.html re-enters location matching, so it still
  # picks up the no-cache rule above.
  location = /app {
    try_files /app/index.html =404;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # Everything else falls back to the landing page.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
