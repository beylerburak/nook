server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://nook-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://nook-api:3000;
  }

  # Hashed filenames (assets-XXXXXXXX.js) never change content under a given
  # name, so browsers and the service worker can cache them forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The app shell, the service worker and the manifest are the three things
  # that decide what a returning client (or the SW's own install step) sees
  # next — never let an intermediate cache serve a stale copy of any of them.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
