<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nook</title>
    <style>
      :root {
        --bg-main: #0a0a0c;
        --bg-card: #131316;
        --bg-card-hover: #18181c;
        --bg-elevated: #202025;
        --border: #26262a;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 380px;
        max-height: 540px;
        overflow-y: auto;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-primary);
        line-height: 1.4;
      }

      /* Custom scrollbar */
      body::-webkit-scrollbar {
        width: 5px;
      }
      body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(10, 10, 12, 0.9);
        backdrop-filter: blur(8px);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .badge {
        font-size: 11px;
        background: var(--bg-elevated);
        color: var(--text-secondary);
        padding: 2px 7px;
        border-radius: 9999px;
        border: 1px solid var(--border);
      }

      .btn-dashboard {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn-dashboard:hover {
        background: var(--bg-elevated);
        border-color: #3f3f46;
        color: #fff;
      }

      #items {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 14px;
      }

      .item {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-card);
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .item:hover {
        background: var(--bg-card-hover);
        border-color: #333338;
      }

      .item-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        margin-top: -2px;
      }

      .item-list-badge {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(59, 130, 246, 0.12);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.25);
      }

      .item-tag {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--bg-elevated);
        color: var(--text-muted);
      }

      .item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .author {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--bg-elevated);
        flex-shrink: 0;
      }

      .avatar-fallback {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #27272a;
        color: var(--text-primary);
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .creator {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .text {
        font-size: 12.5px;
        color: var(--text-primary);
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .media-preview {
        position: relative;
        margin-top: 4px;
        border-radius: 6px;
        overflow: hidden;
        max-height: 140px;
        border: 1px solid var(--border);
        background: #000;
      }

      .media-preview img {
        width: 100%;
        height: 100%;
        max-height: 140px;
        object-fit: cover;
        display: block;
      }

      .media-badge {
        position: absolute;
        bottom: 6px;
        right: 6px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 600;
      }

      .item-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }

      .url {
        color: var(--text-muted);
        font-size: 11px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }

      .url:hover {
        color: var(--text-primary);
      }

      .btn-del {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 3px 5px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        transition: color 0.15s ease;
      }

      .btn-del:hover {
        color: var(--danger);
      }

      .empty {
        padding: 32px 16px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="brand">
        <span class="brand-title">Nook</span>
        <span class="badge" id="popup-count">0</span>
        <button id="sync-x-btn" class="btn-dashboard" style="margin-left:8px; padding:3px 6px; font-size:10px; background:rgba(59,130,246,0.1); color:#3b82f6; border-color:rgba(59,130,246,0.2);" title="Sync X Bookmarks automatically">
          Sync X
        </button>
      </div>
      <button id="open-dashboard" class="btn-dashboard" title="Open full-page dashboard">
        <span>Dashboard</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>

    <div id="items"></div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
